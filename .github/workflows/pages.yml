name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Start the site
        run: |
          dotnet run -c Release --urls http://127.0.0.1:47291 > /tmp/site.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:47291/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/site.log
          exit 1
      - name: Mirror pages
        run: python3 scripts/publish_pages.py /tmp/mahapatra-pages http://127.0.0.1:47291 /mahapatraArts https://rajeev812.github.io
      - name: Publish gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd /tmp/mahapatra-pages
          git init
          git checkout -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Publish site"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin gh-pages
